# Server Block 1: Main Self-Hosted AI Studio App (Default for localhost, IPs, and all self-hosted setups)
server {
    listen 3050 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|js|html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8500/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8500/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:8500/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /p/ {
        proxy_pass http://127.0.0.1:8500/p/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

