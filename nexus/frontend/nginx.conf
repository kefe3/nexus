# Nexus AI Studio Frontend Nginx Gateway

upstream backend_upstream {
    server 127.0.0.1:8500;
    server backend:8500;
    server nexus-backend:8500;
    server host.docker.internal:8500;
}

server {
    listen 3050 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /admin.html {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|js|html|json|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://backend_upstream/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /share/ {
        proxy_pass http://backend_upstream/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /p/ {
        proxy_pass http://backend_upstream/p/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
