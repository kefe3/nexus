services:
  backend:
    build:
      context: ./nexus/backend
    container_name: nexus-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST=0.0.0.0
      - PORT=8500
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11435
    volumes:
      - ./nexus/backend:/app
      - ./:/repo
      - ./nexus/data:/app/data

  frontend:
    build:
      context: ./nexus/frontend
    container_name: nexus-frontend
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nexus/frontend/src:/usr/share/nginx/html
      - ./nexus/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
