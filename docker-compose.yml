services:
  backend:
    image: ghcr.io/kefe3/nexus-backend:v3.1.0
    build:
      context: ./backend
    container_name: nexus-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST=0.0.0.0
      - PORT=8500
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11435
    volumes:
      - ./backend:/app
      - ./:/repo
      - ./data:/app/data
      - /sys:/sys:ro

  frontend:
    image: ghcr.io/kefe3/nexus-frontend:v3.1.0
    build:
      context: ./frontend
    container_name: nexus-frontend
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./frontend/src:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
