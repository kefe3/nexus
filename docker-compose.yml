services:
  backend:
    build:
      context: ./backend
    container_name: nexus-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST=0.0.0.0
      - PORT=8500
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    volumes:
      - ./backend:/app
      - ./:/repo
      - /usr/local/bin/cloudflared:/usr/local/bin/cloudflared:ro
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: nexus-frontend
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./frontend/src:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

# Optional: To run local Ollama inside docker, run: docker compose --profile local-ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ai

volumes:
  ollama_data:
