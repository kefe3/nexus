services:
  backend:
    build:
      context: ../nexus/backend
    container_name: nexus-backend
    restart: unless-stopped
    ports:
      - "8500:8500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=8500
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ../nexus/backend:/app
      - ../:/repo
      - ../nexus/data:/app/data

  frontend:
    build:
      context: ../nexus/frontend
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "3050:3050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../nexus/frontend/src:/usr/share/nginx/html
      - ../nexus/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
